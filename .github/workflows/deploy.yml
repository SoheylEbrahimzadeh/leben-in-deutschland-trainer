name: Deploy LiD Trainer to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: APP
        run: npm install
      - name: Run data-integrity + logic tests
        working-directory: APP
        run: npm test
      - name: Build
        working-directory: APP
        # VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are optional repo
        # secrets (Settings -> Secrets and variables -> Actions). Both are
        # PUBLIC/client-safe values (Supabase project URL + anon/public
        # key, protected by supabase/schema.sql's Row Level Security) that
        # Vite bakes into the static bundle at build time — this is the
        # normal, documented way to configure a Supabase client-side app on
        # a static host. The Supabase SERVICE-ROLE key must never be set
        # here or anywhere else in this repo. Until these secrets are set,
        # both env vars are empty strings and the app runs in guest/local-
        # only mode (see APP/src/lib/supabaseClient.js), so leaving them
        # unset is always safe.
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: APP/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
